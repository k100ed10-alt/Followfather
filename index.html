<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سجل الأسبوع — متابعة مستوى الطلاب</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  @font-face { font-family: 'sys'; src: local('Arial'); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
    background: #F5F1E8;
    color: #1B2A41;
    -webkit-tap-highlight-color: transparent;
  }
  .header { background: #1B2A41; padding: 32px 20px 24px; }
  .eyebrow { color: #C9A227; font-size: 12px; letter-spacing: 2px; font-weight: 700; margin: 0 0 6px; }
  .h-title { color: #FBF9F4; font-size: 24px; font-weight: 800; margin: 0; line-height: 1.3; }
  .back-btn { background: none; border: none; color: #C9A227; font-size: 14px; display: flex; align-items: center; gap: 4px; margin-bottom: 16px; cursor: pointer; padding: 0; }
  .page-body { padding: 20px; }
  .card { background: #FBF9F4; border: 1px solid #E8E1D3; border-radius: 16px; padding: 18px; }
  .card + .card { margin-top: 14px; }
  .btn-primary { width: 100%; background: #1B2A41; color: #FBF9F4; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn-primary:disabled { opacity: .5; }
  .btn-secondary { background: #E8E1D3; color: #5B5647; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
  .field-label { font-size: 12px; color: #8A8371; display: block; margin-bottom: 4px; }
  .input { width: 100%; border: 1px solid #E8E1D3; background: #F5F1E8; border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #1B2A41; }
  .input:disabled { opacity: .5; }
  .error-text { color: #9C4A3C; font-size: 13px; margin-top: 8px; }
  .choice-card { width: 100%; text-align: right; background: #FBF9F4; border: 1px solid #E8E1D3; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .row { display: flex; align-items: center; }
  .space-between { justify-content: space-between; }
  .muted { color: #8A8371; }
  .slider { width: 100%; accent-color: #2F6F63; }
  .student-row { display: flex; align-items: center; gap: 12px; background: #FBF9F4; border: 1px solid #E8E1D3; border-radius: 16px; padding: 14px; margin-top: 10px; }
  .student-main { flex: 1; display: flex; align-items: center; gap: 12px; background: none; border: none; text-align: right; cursor: pointer; padding: 0; }
  .code-chip { display: flex; align-items: center; gap: 4px; background: #F5F1E8; color: #5B5647; border-radius: 8px; padding: 4px 8px; font-size: 12px; font-family: monospace; border: none; cursor: pointer; }
  .week-row { display: flex; align-items: center; justify-content: space-between; background: #FBF9F4; border: 1px solid #E8E1D3; border-radius: 12px; padding: 12px; margin-top: 8px; }
  .dashed-btn { width: 100%; border: 2px dashed #D8CFB8; border-radius: 16px; padding: 16px; background: none; color: #5B5647; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- constants ---------- */
var GRADES = ["الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر", "الحادي عشر", "الثاني عشر"];
var METRIC_DEFS = [
  { key: "attendance", label: "الحضور", hint: "الالتزام بمواعيد الحصص" },
  { key: "commitment", label: "الالتزام", hint: "إنجاز الواجبات والمهام" },
  { key: "participation", label: "المشاركة", hint: "التفاعل داخل الحصة" },
  { key: "behavior", label: "السلوك", hint: "الانضباط داخل الصف" }
];
var STORE_KEY = "register-data-v1";
var MAX_ATTEMPTS = 5;
var LOCK_SECONDS = 60;

/* ---------- helpers ---------- */
function overallScore(r) {
  return Math.round((Number(r.attendance) + Number(r.commitment) + Number(r.participation) + Number(r.behavior)) / 4);
}
function scoreTier(score) {
  if (score >= 85) return { label: "ممتاز", color: "#2F6F63", bg: "#EAF3F0" };
  if (score >= 70) return { label: "جيد", color: "#4C7A6D", bg: "#EEF4EC" };
  if (score >= 50) return { label: "متوسط", color: "#C9A227", bg: "#FBF3DD" };
  return { label: "يحتاج متابعة", color: "#9C4A3C", bg: "#F7E9E6" };
}
function genCode() {
  var chars = "23456789ABCDEFGHJKMNPQRSTUVWXYZ", s = "";
  for (var i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function uid() { return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9); }
function fmtWeek(dateStr) {
  if (!dateStr) return "";
  var d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("ar-SA", { day: "numeric", month: "long", year: "numeric" });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ---------- inline icons ---------- */
function icon(name, size, color) {
  size = size || 20; color = color || "currentColor";
  var paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/>',
    arrowRight: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
    chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
    clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check: '<polyline points="20 6 9 17 4 12"/>'
  };
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || "") + "</svg>";
}

/* ---------- score stamp (SVG ring) ---------- */
function scoreStamp(score, size) {
  size = size || 128;
  var tier = scoreTier(score);
  var r = size / 2 - 8;
  var c = 2 * Math.PI * r;
  var offset = c - (score / 100) * c;
  var fontBig = Math.round(size * 0.3);
  return '' +
    '<div style="position:relative;width:' + size + 'px;height:' + size + 'px;flex-shrink:0;">' +
      '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);">' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#E8E1D3" stroke-width="7"/>' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + tier.color + '" stroke-width="7" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"/>' +
      '</svg>' +
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
        '<span style="font-weight:800;font-size:' + fontBig + 'px;color:#1B2A41;line-height:1;">' + score + '</span>' +
        '<span style="font-size:10px;margin-top:4px;color:#8A8371;">من ١٠٠</span>' +
      '</div>' +
    '</div>';
}
function miniBar(label, value) {
  var tier = scoreTier(value);
  return '' +
    '<div>' +
      '<div class="row space-between" style="margin-bottom:4px;">' +
        '<span style="font-size:13px;color:#5B5647;">' + esc(label) + '</span>' +
        '<span style="font-weight:700;font-size:13px;color:' + tier.color + ';">' + value + '</span>' +
      '</div>' +
      '<div style="height:8px;border-radius:8px;width:100%;background:#E8E1D3;">' +
        '<div style="height:8px;border-radius:8px;width:' + value + '%;background:' + tier.color + ';"></div>' +
      '</div>' +
    '</div>';
}

/* ---------- Firebase setup ----------
   Replace the values below with the config from your own Firebase
   project (Firebase Console → Project settings → General → Your apps).
   Until you do, the app falls back to this-device-only storage. */
var firebaseConfig = {
  apiKey: "AIzaSyCDo8TzEZRW4Iq0fyY0pBaZxMlwUv_5XOU",
  authDomain: "followfather-984a6.firebaseapp.com",
  projectId: "followfather-984a6",
  storageBucket: "followfather-984a6.firebasestorage.app",
  messagingSenderId: "149458409578",
  appId: "1:149458409578:web:f571dfbd98447a799fd213"
};

var db = null;
var syncStatus = "init"; // init | connected | local-only | error
var syncError = "";
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY" && window.firebase) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } else {
    syncStatus = "local-only";
  }
} catch (e) {
  syncStatus = "error";
  syncError = String(e && e.message ? e.message : e);
  console.error("Firebase init failed:", e);
}

/* ---------- storage (Firestore, with local fallback) ---------- */
var EMPTY_DATA = { passcode: null, students: [], reports: [] };
function loadData() {
  if (db) {
    return db.collection("register").doc("data").get().then(function (doc) {
      syncStatus = "connected";
      syncError = "";
      return doc.exists ? doc.data() : EMPTY_DATA;
    }).catch(function (e) {
      syncStatus = "error";
      syncError = String(e && e.message ? e.message : e);
      console.error("Firestore read failed, using local copy:", e);
      return fallbackLoadSync();
    });
  }
  return Promise.resolve(fallbackLoadSync());
}
function fallbackLoadSync() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : EMPTY_DATA;
  } catch (e) {
    return EMPTY_DATA;
  }
}
function saveData(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  if (db) {
    return db.collection("register").doc("data").set(data).then(function () {
      syncStatus = "connected";
      syncError = "";
      return true;
    }).catch(function (e) {
      syncStatus = "error";
      syncError = String(e && e.message ? e.message : e);
      console.error("Firestore write failed:", e);
      return false;
    });
  }
  return Promise.resolve(false);
}

/* ---------- app state ---------- */
var state = {
  data: null,
  route: "loading",
  teacherAuthed: false,
  selectedStudentId: null,
  parentStudent: null,
  attempts: 0,
  lockUntil: null
};
var form = { loginPass: "", setupP1: "", setupP2: "", addName: "", parentCode: "", weekDate: todayStr(), metrics: { attendance: 80, commitment: 80, participation: 80, behavior: 80 } };
var lockTimer = null;

function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function persist(next) {
  state.data = next;
  return saveData(next);
}

function syncBanner() {
  if (syncStatus === "connected") {
    return '<div style="background:#EAF3F0;color:#2F6F63;font-size:12px;text-align:center;padding:7px;">✓ متصل — البيانات تتزامن بين الأجهزة</div>';
  }
  if (syncStatus === "error") {
    return '<div style="background:#F7E9E6;color:#9C4A3C;font-size:11px;text-align:center;padding:7px;">⚠ خطأ اتصال بقاعدة البيانات: ' + esc(syncError) + '</div>';
  }
  if (syncStatus === "local-only") {
    return '<div style="background:#FBF3DD;color:#C9A227;font-size:12px;text-align:center;padding:7px;">⚠ غير متصل بقاعدة بيانات — التخزين محلي بهذا الجهاز فقط</div>';
  }
  return '';
}

/* ---------- render root ---------- */
function render() {
  var html = "";
  switch (state.route) {
    case "loading": html = renderLoading(); break;
    case "home": html = renderHome(); break;
    case "teacherLogin": html = renderTeacherLogin(); break;
    case "teacherDashboard": html = renderTeacherDashboard(); break;
    case "studentDetail": html = renderStudentDetail(); break;
    case "parentLogin": html = renderParentLogin(); break;
    case "parentReport": html = renderParentReport(); break;
  }
  document.getElementById("root").innerHTML = syncBanner() + html;
  afterRender();
}

function afterRender() {
  if (state.route === "teacherLogin" && state.lockUntil) startLockCountdown();
}

/* ---------- screens ---------- */
function renderLoading() {
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span class="muted">جارٍ التحميل…</span></div>';
}

function renderHome() {
  return '' +
    '<div class="header" style="padding-top:56px;padding-bottom:40px;">' +
      '<p class="eyebrow">سجل الأسبوع</p>' +
      '<h1 class="h-title" style="font-size:28px;">متابعة مستوى الطلاب،<br>أسبوعًا بأسبوع</h1>' +
      '<p style="color:#B9C2CE;font-size:14px;margin-top:10px;">المعلم يسجّل التقييم، وولي الأمر يطّلع على النتيجة برقم واضح.</p>' +
    '</div>' +
    '<div class="page-body" style="margin-top:-24px;">' +
      '<button class="choice-card" onclick="goTeacherEntry()">' +
        '<div class="icon-box" style="background:#EAF3F0;">' + icon("clipboard", 22, "#2F6F63") + '</div>' +
        '<div style="flex:1;"><p style="font-weight:700;font-size:16px;margin:0;">أنا معلّم</p><p class="muted" style="font-size:12px;margin:4px 0 0;">إضافة الطلاب وتسجيل التقييم الأسبوعي</p></div>' +
        icon("chevronLeft", 20, "#8A8371") +
      '</button>' +
      '<div style="height:14px;"></div>' +
      '<button class="choice-card" onclick="goParentEntry()">' +
        '<div class="icon-box" style="background:#FBF3DD;">' + icon("search", 22, "#C9A227") + '</div>' +
        '<div style="flex:1;"><p style="font-weight:700;font-size:16px;margin:0;">أنا ولي أمر</p><p class="muted" style="font-size:12px;margin:4px 0 0;">عرض تقرير الابن عبر رمز الدخول</p></div>' +
        icon("chevronLeft", 20, "#8A8371") +
      '</button>' +
    '</div>';
}

function pageHeader(eyebrow, title, backHandler) {
  return '' +
    '<div class="header">' +
      (backHandler ? '<button class="back-btn" onclick="' + backHandler + '()">' + icon("arrowRight", 16, "#C9A227") + ' رجوع</button>' : '') +
      '<p class="eyebrow">' + esc(eyebrow) + '</p>' +
      '<h1 class="h-title">' + esc(title) + '</h1>' +
    '</div>';
}

function renderTeacherLogin() {
  var body;
  if (!state.data.passcode) {
    body = '' +
      '<div class="card">' +
        '<p style="font-size:14px;color:#5B5647;margin:0 0 16px;">أول مرة؟ اختر رمز دخول لحماية لوحة المعلم.</p>' +
        '<label class="field-label">رمز جديد</label>' +
        '<input type="text" autocomplete="off" class="input" id="setupP1" oninput="onSetupInput(1,this.value)" style="margin-bottom:2px;">' +
        '<p class="muted" style="font-size:11px;margin:0 0 12px;">عدد الرموز: <span id="countP1">0</span></p>' +
        '<label class="field-label">تأكيد الرمز</label>' +
        '<input type="text" autocomplete="off" class="input" id="setupP2" oninput="onSetupInput(2,this.value)">' +
        '<p class="muted" style="font-size:11px;margin:4px 0 0;">عدد الرموز: <span id="countP2">0</span></p>' +
        '<div id="setupError"></div>' +
        '<div style="height:16px;"></div>' +
        '<button class="btn-primary" onclick="submitSetup()">حفظ ومتابعة</button>' +
      '</div>';
  } else {
    var locked = state.lockUntil && Date.now() < state.lockUntil;
    body = '' +
      '<div class="card">' +
        '<label class="field-label">أدخل رمز الدخول الخاص بك</label>' +
        '<input type="password" class="input" id="loginPass" ' + (locked ? "disabled" : "") + ' style="text-align:center;letter-spacing:4px;font-size:18px;" oninput="form.loginPass=this.value" onkeydown="if(event.key===\'Enter\')submitLogin()" placeholder="••••">' +
        '<div id="loginMsg">' + (locked ? '<p class="error-text" style="text-align:center;" id="lockMsg">محاولات كثيرة خاطئة. حاول بعد <span id="lockSecs">' + Math.ceil((state.lockUntil - Date.now()) / 1000) + '</span> ثانية</p>' : '') + '</div>' +
        '<div style="height:16px;"></div>' +
        '<button class="btn-primary" id="loginBtn" ' + (locked ? "disabled" : "") + ' onclick="submitLogin()">دخول</button>' +
      '</div>';
  }
  return pageHeader("دخول المعلم", "رمز الدخول", "goHome") + '<div class="page-body">' + body + '</div>';
}

function onSetupInput(which, value) {
  if (which === 1) {
    form.setupP1 = value;
    document.getElementById("countP1").textContent = value.trim().length;
  } else {
    form.setupP2 = value;
    document.getElementById("countP2").textContent = value.trim().length;
  }
}

function submitSetup() {
  var el1 = document.getElementById("setupP1"), el2 = document.getElementById("setupP2");
  var p1 = ((el1 ? el1.value : form.setupP1) || "").trim();
  var p2 = ((el2 ? el2.value : form.setupP2) || "").trim();
  var err = "";
  if (p1.length < 6) err = "اجعل الرمز ٦ خانات على الأقل (المسجّل حاليًا: " + p1.length + ")";
  else if (p1 !== p2) err = "الرمزان غير متطابقين";
  if (err) {
    document.getElementById("setupError").innerHTML = '<p class="error-text">' + esc(err) + '</p>';
    return;
  }
  document.getElementById("setupError").innerHTML = '<p class="muted" style="font-size:12px;">جارٍ الحفظ…</p>';
  persist(Object.assign({}, state.data, { passcode: p1 })).then(function (ok) {
    if (db && !ok) {
      document.getElementById("setupError").innerHTML = '<p class="error-text">تعذّر الحفظ على قاعدة البيانات: ' + esc(syncError) + '. تم الحفظ محليًا فقط لهذا الجهاز.</p>';
    }
    state.teacherAuthed = true;
    state.route = "teacherDashboard";
    render();
  });
}

function submitLogin() {
  if (state.lockUntil && Date.now() < state.lockUntil) return;
  var el = document.getElementById("loginPass");
  var pass = ((el ? el.value : form.loginPass) || "").trim();
  if (pass === state.data.passcode) {
    state.teacherAuthed = true;
    state.attempts = 0;
    state.route = "teacherDashboard";
    render();
  } else {
    state.attempts += 1;
    form.loginPass = "";
    if (state.attempts >= MAX_ATTEMPTS) {
      state.lockUntil = Date.now() + LOCK_SECONDS * 1000;
      render();
    } else {
      document.getElementById("loginMsg").innerHTML = '<p class="error-text">الرمز غير صحيح — محاولة ' + state.attempts + ' من ' + MAX_ATTEMPTS + '</p>';
      var inp = document.getElementById("loginPass");
      if (inp) inp.value = "";
    }
  }
}

function startLockCountdown() {
  if (lockTimer) clearInterval(lockTimer);
  lockTimer = setInterval(function () {
    var secs = Math.ceil((state.lockUntil - Date.now()) / 1000);
    if (secs <= 0) {
      clearInterval(lockTimer);
      state.lockUntil = null;
      render();
      return;
    }
    var el = document.getElementById("lockSecs");
    if (el) el.textContent = secs;
  }, 500);
}

function goTeacherEntry() {
  state.route = "teacherLogin";
  state.attempts = 0;
  form.loginPass = ""; form.setupP1 = ""; form.setupP2 = "";
  render();
}
function goParentEntry() {
  state.route = "parentLogin";
  form.parentCode = "";
  render();
}
function goHome() {
  state.route = "home";
  state.teacherAuthed = false;
  render();
}

/* ---------- teacher dashboard ---------- */
var copiedTimeout = null;
function renderTeacherDashboard() {
  var students = state.data.students;
  var filter = state.gradeFilter || "all";
  var visible = filter === "all" ? students : students.filter(function (s) { return (s.grade || "") === filter; });

  var filterBar = '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;">' +
    gradeChip("all", "الكل", filter) +
    GRADES.map(function (g) { return gradeChip(g, g, filter); }).join("") +
    '</div>';

  var list = "";
  if (students.length === 0) {
    list = '<div style="text-align:center;padding:40px 0;">' + icon("users", 32, "#C9BFA8") + '<p class="muted" style="margin-top:8px;">لا يوجد طلاب بعد. أضف أول طالب لتبدأ.</p></div>';
  } else if (visible.length === 0) {
    list = '<div style="text-align:center;padding:30px 0;"><p class="muted">لا يوجد طلاب بهذا الصف.</p></div>';
  } else if (filter !== "all") {
    list = studentRows(visible);
  } else {
    var groups = GRADES.concat([""]);
    groups.forEach(function (g) {
      var inGrade = students.filter(function (s) { return (s.grade || "") === g; });
      if (inGrade.length === 0) return;
      list += '<p style="font-weight:700;font-size:13px;color:#8A8371;margin:18px 0 6px;">' + esc(g || "الصف غير محدد") + ' <span class="muted" style="font-weight:400;">(' + inGrade.length + ')</span></p>';
      list += studentRows(inGrade);
    });
  }

  var addSection = '' +
    '<button class="dashed-btn" onclick="showAddForm()" id="addToggle">' + icon("plus", 18) + ' إضافة طالب</button>' +
    '<div class="card" id="addForm" style="display:none;margin-top:10px;">' +
      '<label class="field-label">اسم الطالب</label>' +
      '<input class="input" id="addNameInput" oninput="form.addName=this.value" onkeydown="if(event.key===\'Enter\')submitAddStudent()" placeholder="مثال: سارة أحمد" style="margin-bottom:12px;">' +
      '<label class="field-label">الصف</label>' +
      '<select class="input" id="addGradeSelect">' +
        GRADES.map(function (g) { return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join("") +
      '</select>' +
      '<div style="display:flex;gap:8px;margin-top:12px;">' +
        '<button class="btn-primary" style="flex:1;" onclick="submitAddStudent()">إضافة</button>' +
        '<button class="btn-secondary" onclick="hideAddForm()">إلغاء</button>' +
      '</div>' +
    '</div>';

  return '' +
    '<div class="header" style="display:flex;align-items:flex-start;justify-content:space-between;">' +
      '<div><p class="eyebrow">لوحة المعلم</p><h1 class="h-title">الطلاب</h1></div>' +
      '<button onclick="goHome()" style="background:none;border:none;color:#B9C2CE;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;margin-top:8px;">' + icon("logout", 14) + ' خروج</button>' +
    '</div>' +
    '<div class="page-body">' + filterBar + list + '<div style="height:6px;"></div>' + addSection + '</div>';
}

function gradeChip(value, label, active) {
  var isActive = value === active;
  return '<button onclick="setGradeFilter(\'' + value + '\')" style="white-space:nowrap;border-radius:999px;padding:6px 14px;font-size:12px;border:1px solid ' + (isActive ? "#1B2A41" : "#E8E1D3") + ';background:' + (isActive ? "#1B2A41" : "#FBF9F4") + ';color:' + (isActive ? "#FBF9F4" : "#5B5647") + ';cursor:pointer;">' + esc(label) + '</button>';
}
function setGradeFilter(value) {
  state.gradeFilter = value;
  render();
}

function studentRows(list) {
  var html = "";
  list.forEach(function (s) {
    var reports = state.data.reports.filter(function (r) { return r.studentId === s.id; }).sort(function (a, b) { return b.weekDate.localeCompare(a.weekDate); });
    var latest = reports[0];
    var stampHtml = latest ? scoreStamp(overallScore(latest), 52) : '<div style="width:52px;height:52px;border-radius:50%;background:#E8E1D3;display:flex;align-items:center;justify-content:center;"><span class="muted" style="font-size:12px;">—</span></div>';
    html += '' +
      '<div class="student-row">' +
        '<button class="student-main" onclick="openStudent(\'' + s.id + '\')">' +
          stampHtml +
          '<div style="flex:1;"><p style="font-weight:700;font-size:15px;margin:0;">' + esc(s.name) + '</p><p class="muted" style="font-size:12px;margin:4px 0 0;">' + (reports.length > 0 ? reports.length + " تقرير مسجّل" : "لا يوجد تقييم بعد") + '</p></div>' +
        '</button>' +
        '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">' +
          '<button class="code-chip" onclick="copyCode(\'' + s.id + '\',\'' + s.code + '\')" id="chip-' + s.id + '">' + icon("copy", 12) + ' ' + s.code + '</button>' +
          '<button style="background:none;border:none;cursor:pointer;padding:2px;" onclick="removeStudent(\'' + s.id + '\')">' + icon("trash", 14, "#C9BFA8") + '</button>' +
        '</div>' +
      '</div>';
  });
  return html;
}

function showAddForm() {
  document.getElementById("addForm").style.display = "block";
  document.getElementById("addToggle").style.display = "none";
  form.addName = "";
  document.getElementById("addNameInput").focus();
}
function hideAddForm() {
  document.getElementById("addForm").style.display = "none";
  document.getElementById("addToggle").style.display = "flex";
}
function submitAddStudent() {
  var el = document.getElementById("addNameInput");
  var name = ((el ? el.value : form.addName) || "").trim();
  if (!name) {
    if (el) { el.style.borderColor = "#9C4A3C"; el.placeholder = "اكتب اسم الطالب هنا"; }
    return;
  }
  var gradeEl = document.getElementById("addGradeSelect");
  var grade = gradeEl ? gradeEl.value : GRADES[0];
  var student = { id: uid(), name: name, grade: grade, code: genCode() };
  var next = Object.assign({}, state.data, { students: state.data.students.concat([student]) });
  persist(next);
  render();
}
function removeStudent(id) {
  var next = Object.assign({}, state.data, {
    students: state.data.students.filter(function (s) { return s.id !== id; }),
    reports: state.data.reports.filter(function (r) { return r.studentId !== id; })
  });
  persist(next);
  render();
}
function copyCode(id, code) {
  if (navigator.clipboard) navigator.clipboard.writeText(code).catch(function () {});
  var chip = document.getElementById("chip-" + id);
  if (chip) chip.innerHTML = icon("check", 12) + " " + code;
  if (copiedTimeout) clearTimeout(copiedTimeout);
  copiedTimeout = setTimeout(function () {
    if (chip) chip.innerHTML = icon("copy", 12) + " " + code;
  }, 1500);
}

/* ---------- student detail ---------- */
function backToDashboard() {
  state.selectedStudentId = null;
  state.route = "teacherDashboard";
  render();
}
function openStudent(id) {
  state.selectedStudentId = id;
  form.weekDate = todayStr();
  var existing = state.data.reports.find(function (r) { return r.studentId === id && r.weekDate === form.weekDate; });
  form.metrics = existing
    ? { attendance: existing.attendance, commitment: existing.commitment, participation: existing.participation, behavior: existing.behavior }
    : { attendance: 80, commitment: 80, participation: 80, behavior: 80 };
  state.route = "studentDetail";
  render();
}

function renderStudentDetail() {
  var student = state.data.students.find(function (s) { return s.id === state.selectedStudentId; });
  if (!student) { state.route = "teacherDashboard"; return renderTeacherDashboard(); }
  var reports = state.data.reports.filter(function (r) { return r.studentId === student.id; }).sort(function (a, b) { return b.weekDate.localeCompare(a.weekDate); });

  var sliders = METRIC_DEFS.map(function (m) {
    return '' +
      '<div style="margin-top:16px;">' +
        '<div class="row space-between" style="align-items:baseline;">' +
          '<label style="font-weight:500;font-size:14px;">' + esc(m.label) + '</label>' +
          '<span id="val-' + m.key + '" style="font-weight:700;color:#2F6F63;">' + form.metrics[m.key] + '</span>' +
        '</div>' +
        '<p class="muted" style="font-size:12px;margin:2px 0 4px;">' + esc(m.hint) + '</p>' +
        '<input type="range" class="slider" min="0" max="100" value="' + form.metrics[m.key] + '" oninput="onMetricChange(\'' + m.key + '\', this.value)">' +
      '</div>';
  }).join("");

  var historyHtml = "";
  if (reports.length > 0) {
    historyHtml = '<p style="font-weight:700;margin:20px 0 10px;">سجل الأسابيع السابقة</p>';
    reports.forEach(function (r) {
      var tier = scoreTier(overallScore(r));
      historyHtml += '' +
        '<div class="week-row">' +
          '<div><p style="font-size:14px;margin:0;">' + fmtWeek(r.weekDate) + '</p><p style="font-size:12px;margin:2px 0 0;color:' + tier.color + ';">' + tier.label + '</p></div>' +
          '<span style="font-weight:800;font-size:20px;color:' + tier.color + ';">' + overallScore(r) + '</span>' +
        '</div>';
    });
  }

  return pageHeader("تقييم أسبوعي", student.name + (student.grade ? " — الصف " + student.grade : ""), "backToDashboard") +
    '<div class="page-body">' +
      '<div class="card">' +
        '<p style="font-weight:700;margin:0 0 4px;">رمز ولي الأمر</p>' +
        '<p style="font-size:24px;letter-spacing:6px;text-align:center;padding:10px;border-radius:12px;background:#F5F1E8;font-family:monospace;margin:8px 0 4px;">' + student.code + '</p>' +
        '<p class="muted" style="font-size:12px;text-align:center;margin:4px 0 0;">شارك هذا الرمز مع ولي الأمر للاطّلاع على التقرير</p>' +
      '</div>' +
      '<div class="card">' +
        '<p style="font-weight:700;margin:0 0 12px;">تقييم الأسبوع</p>' +
        '<label class="field-label">بداية الأسبوع</label>' +
        '<input type="date" class="input" value="' + form.weekDate + '" oninput="form.weekDate=this.value">' +
        sliders +
        '<div class="row" style="gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid #E8E1D3;">' +
          '<div id="stampHolder">' + scoreStamp(overallScore(form.metrics), 64) + '</div>' +
          '<button class="btn-primary" style="flex:1;" id="saveBtn" onclick="saveReport(\'' + student.id + '\')">حفظ التقييم</button>' +
        '</div>' +
      '</div>' +
      historyHtml +
    '</div>';
}

function onMetricChange(key, value) {
  form.metrics[key] = Number(value);
  document.getElementById("val-" + key).textContent = value;
  document.getElementById("stampHolder").innerHTML = scoreStamp(overallScore(form.metrics), 64);
}

function saveReport(studentId) {
  var idx = state.data.reports.findIndex(function (r) { return r.studentId === studentId && r.weekDate === form.weekDate; });
  var next = Object.assign({}, state.data);
  next.reports = state.data.reports.slice();
  if (idx >= 0) {
    next.reports[idx] = Object.assign({}, next.reports[idx], form.metrics);
  } else {
    next.reports.push(Object.assign({ id: uid(), studentId: studentId, weekDate: form.weekDate }, form.metrics));
  }
  persist(next);
  var btn = document.getElementById("saveBtn");
  btn.textContent = "تم الحفظ ✓";
  btn.style.background = "#2F6F63";
  setTimeout(function () { render(); }, 900);
}

/* ---------- parent ---------- */
function renderParentLogin() {
  return pageHeader("دخول ولي الأمر", "أدخل رمز الطالب", "goHome") +
    '<div class="page-body">' +
      '<div class="card">' +
        '<div class="icon-box" style="background:#FBF3DD;margin-bottom:12px;">' + icon("key", 22, "#C9A227") + '</div>' +
        '<p style="font-size:14px;color:#5B5647;margin:0 0 16px;">استلم الرمز من المعلم، وأدخله هنا لعرض تقرير ابنك.</p>' +
        '<input class="input" id="parentCodeInput" style="text-align:center;letter-spacing:6px;font-size:20px;font-family:monospace;" maxlength="8" placeholder="XXXXX" oninput="form.parentCode=this.value" onkeydown="if(event.key===\'Enter\')submitParentCode()">' +
        '<div id="parentErr"></div>' +
        '<div style="height:16px;"></div>' +
        '<button class="btn-primary" onclick="submitParentCode()">عرض التقرير</button>' +
      '</div>' +
    '</div>';
}
function submitParentCode() {
  var el = document.getElementById("parentCodeInput");
  var code = ((el ? el.value : form.parentCode) || "").trim().toUpperCase();
  var match = state.data.students.find(function (s) { return s.code.toUpperCase() === code; });
  if (!match) {
    document.getElementById("parentErr").innerHTML = '<p class="error-text" style="text-align:center;">لم يتم العثور على طالب بهذا الرمز</p>';
    return;
  }
  state.parentStudent = match;
  state.route = "parentReport";
  render();
}

function renderParentReport() {
  var student = state.parentStudent;
  var reports = state.data.reports.filter(function (r) { return r.studentId === student.id; }).sort(function (a, b) { return b.weekDate.localeCompare(a.weekDate); });
  var latest = reports[0];
  var body;
  if (!latest) {
    body = '<div style="text-align:center;padding:48px 0;">' + icon("clipboard", 32, "#C9BFA8") + '<p class="muted" style="margin-top:8px;">لم يُسجَّل تقييم لهذا الطالب بعد.</p></div>';
  } else {
    var tier = scoreTier(overallScore(latest));
    var metricsHtml = METRIC_DEFS.map(function (m) { return miniBar(m.label, latest[m.key]); }).join('<div style="height:14px;"></div>');
    var histHtml = "";
    if (reports.length > 1) {
      histHtml = '<p style="font-weight:700;margin:20px 0 10px;">الأسابيع السابقة</p>';
      reports.slice(1).forEach(function (r) {
        var t = scoreTier(overallScore(r));
        histHtml += '<div class="week-row"><p style="font-size:14px;margin:0;">' + fmtWeek(r.weekDate) + '</p><span style="font-weight:800;font-size:16px;color:' + t.color + ';">' + overallScore(r) + '</span></div>';
      });
    }
    body = '' +
      '<div class="card row" style="gap:16px;">' +
        scoreStamp(overallScore(latest), 96) +
        '<div><p class="muted" style="font-size:12px;margin:0;">تقرير أسبوع</p><p style="font-weight:700;font-size:15px;margin:2px 0 6px;">' + fmtWeek(latest.weekDate) + '</p>' +
        '<span style="font-size:12px;padding:3px 10px;border-radius:999px;background:' + tier.bg + ';color:' + tier.color + ';">' + tier.label + '</span></div>' +
      '</div>' +
      '<div class="card">' +
        '<p style="font-weight:700;margin:0 0 14px;">تفاصيل التقييم</p>' + metricsHtml +
      '</div>' +
      histHtml;
  }
  return pageHeader("تقرير الطالب", student.name + (student.grade ? " — الصف " + student.grade : ""), "backToParentLogin") + '<div class="page-body">' + body + '</div>';
}
function backToParentLogin() {
  state.parentStudent = null;
  state.route = "parentLogin";
  render();
}

/* ---------- boot ---------- */
loadData().then(function (d) {
  state.data = d;
  state.route = "home";
  render();
});
</script>
</body>
</html>
